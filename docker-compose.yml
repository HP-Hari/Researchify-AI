services:
  researchify-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: researchify-ai:latest
    container_name: researchify-ai
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-REDACTED_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
